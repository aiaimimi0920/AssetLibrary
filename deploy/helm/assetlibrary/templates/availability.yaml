{{- $root := . -}}
{{- range $name := list "api" "web" }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assetlibrary.name" $root }}-{{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
{{- if $root.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "assetlibrary.name" $root }}-{{ $name }}
spec:
  scaleTargetRef:
    apiVersion: {{ if $root.Values.progressiveDelivery.enabled }}argoproj.io/v1alpha1{{ else }}apps/v1{{ end }}
    kind: {{ if $root.Values.progressiveDelivery.enabled }}Rollout{{ else }}Deployment{{ end }}
    name: {{ include "assetlibrary.name" $root }}-{{ $name }}
  minReplicas: {{ $root.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assetlibrary.name" . }}-outbox
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: outbox
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assetlibrary.name" . }}-scanner
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: scanner
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "assetlibrary.name" . }}-indexer
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: indexer
