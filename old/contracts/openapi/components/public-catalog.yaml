PublisherProfile:
  type: object
  additionalProperties: false
  required: [schema_version, publisher]
  properties:
    schema_version: { const: '1.0' }
    publisher: { $ref: '../openapi.yaml#/components/schemas/PublisherSummary' }

HostProduct:
  type: string
  enum: [loom, hook]

ProductCompatibility:
  type: object
  additionalProperties: false
  required: [name, version_requirement]
  properties:
    name: { $ref: '#/HostProduct' }
    version_requirement: { type: string, minLength: 1, maxLength: 100 }

PublicCompatibility:
  type: object
  additionalProperties: false
  required: [products]
  properties:
    products:
      type: array
      maxItems: 8
      uniqueItems: true
      items: { $ref: '#/ProductCompatibility' }

PublishedReleaseArtifact:
  type: object
  additionalProperties: false
  required: [artifact_id, release_id, digest, size_bytes, media_type, file_name, signing_key_id]
  properties:
    artifact_id: { type: string, format: uuid }
    release_id: { type: string, format: uuid }
    digest: { type: string, pattern: '^[a-f0-9]{64}$' }
    size_bytes: { type: integer, format: int64, minimum: 1 }
    media_type: { type: string, minLength: 1, maxLength: 200 }
    file_name: { type: string, pattern: '^[A-Za-z0-9._-]{1,180}$' }
    signing_key_id: { type: string, minLength: 1, maxLength: 160 }

PublishedRelease:
  type: object
  additionalProperties: false
  required: [id, version, published_at, compatibility, permissions, artifacts]
  properties:
    id: { type: string, format: uuid }
    version: { type: string, minLength: 1, maxLength: 100 }
    published_at: { type: string, format: date-time }
    compatibility: { $ref: '#/PublicCompatibility' }
    permissions:
      type: array
      maxItems: 64
      uniqueItems: true
      items: { type: string, minLength: 1, maxLength: 160 }
    artifacts:
      type: array
      minItems: 1
      maxItems: 32
      items: { $ref: '#/PublishedReleaseArtifact' }

PublishedReleasePage:
  type: object
  additionalProperties: false
  required: [schema_version, items, next_cursor]
  properties:
    schema_version: { const: '1.0' }
    items:
      type: array
      maxItems: 100
      items: { $ref: '#/PublishedRelease' }
    next_cursor: { type: [string, 'null'], maxLength: 256 }
