{{- if .Values.scanner.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "assetlibrary.name" . }}-scanner
  labels:
    {{- include "assetlibrary.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "assetlibrary.name" . }}-scanner
  pollingInterval: {{ .Values.scanner.autoscaling.pollingInterval }}
  cooldownPeriod: {{ .Values.scanner.autoscaling.cooldownPeriod }}
  minReplicaCount: {{ .Values.scanner.autoscaling.minReplicas }}
  maxReplicaCount: {{ .Values.scanner.autoscaling.maxReplicas }}
  fallback:
    failureThreshold: 3
    replicas: {{ .Values.scanner.autoscaling.minReplicas }}
  triggers:
    - type: nats-jetstream
      metadata:
        natsServerMonitoringEndpoint: {{ required "config.natsMonitoringEndpoint is required for scanner autoscaling" .Values.config.natsMonitoringEndpoint | quote }}
        account: {{ .Values.config.natsAccount | quote }}
        stream: {{ .Values.config.natsStream | quote }}
        consumer: {{ .Values.scanner.consumerName | quote }}
        lagThreshold: {{ .Values.scanner.autoscaling.lagThreshold | quote }}
        activationLagThreshold: "0"
        useHttps: {{ .Values.config.natsMonitoringUseHttps | quote }}
{{- end }}
