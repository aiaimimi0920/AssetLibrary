version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 4
    groups:
      opentelemetry:
        update-types: [minor, patch]
        patterns:
          - "opentelemetry"
          - "opentelemetry-*"
          - "opentelemetry_sdk"
          - "tracing-opentelemetry"
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directory: /packages/api-client
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /services/edge
    schedule: { interval: weekly }
    cooldown:
      default-days: 7
      semver-major-days: 21
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 3
