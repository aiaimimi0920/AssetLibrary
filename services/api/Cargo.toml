[package]
name = "assetlibrary-api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
assetlibrary-contracts = { path = "../../crates/contracts" }
assetlibrary-object-store = { path = "../../crates/object-store" }
assetlibrary-supply-chain = { path = "../../crates/supply-chain" }
assetlibrary-telemetry = { path = "../../crates/telemetry" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json", "time"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
time = { version = "0.3.55", features = ["formatting", "parsing", "serde"] }
tracing = "0.1"
tower-http = { version = "0.7", features = ["request-id", "trace"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
