name: AssetLibrary CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assetlibrary-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
      - name: Check active source
        run: |
          pnpm check
          pnpm typecheck
          pnpm sizecheck
      - name: Test Worker and local business paths
        run: pnpm test
      - name: Audit active dependency lock
        run: pnpm audit --audit-level=low

  secret_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Install checksum-verified Gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan current tracked active tree
        run: |
          mkdir -p "$RUNNER_TEMP/active-source"
          git ls-files -z -- . ':(exclude)old/**' |
            tar --null -T - -cf - | tar -xf - -C "$RUNNER_TEMP/active-source"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir --redact=100 --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-active.json" \
            "$RUNNER_TEMP/active-source"
      - name: Scan introduced commits, including archived paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          RANGE="$(node scripts/ci-secret-range.mjs)"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner \
            --log-opts="$RANGE" --report-format=json \
            --report-path="$RUNNER_TEMP/gitleaks-commits.json" .
