name: Reusable security policy

on:
  workflow_call:
    inputs:
      source_ref:
        description: Full commit SHA to scan; defaults to the triggering SHA
        required: false
        type: string
        default: ""
      development-advisory:
        description: Report validated dependency findings without blocking development
        required: false
        type: boolean
        default: false
    outputs:
      scanned_commit:
        description: Exact commit scanned by the shared security policy
        value: ${{ jobs.dependencies.outputs.commit }}

permissions:
  actions: read
  contents: read

jobs:
  report-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Verify synthetic scan-report contracts
        run: |
          python3 -m unittest discover -s scripts/tests -p test_security_scan_summary.py
          python3 -m unittest discover -s scripts/tests -p test_sarif_coverage.py
          node --test scripts/tests/codeql-summary.test.mjs
          python3 -m unittest discover -s scripts/tests -p test_security_findings.py
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          warn-only: ${{ inputs.development-advisory }}
      - name: Validate and retain Dependency Review outputs
        env:
          REVIEW_CHANGES: ${{ steps.review.outputs.dependency-changes }}
          REVIEW_VULNERABLE: ${{ steps.review.outputs.vulnerable-changes }}
          REVIEW_SUMMARY: ${{ steps.review.outputs.comment-content }}
        run: python3 scripts/security_findings.py review --report release/evidence/dependency-review.json --exit-code 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: dependency-review-${{ github.sha }}
          path: release/evidence/dependency-review*.json
          if-no-files-found: error

  dependencies:
    needs: report-contract
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: commit
        name: Bind evidence to the triggering commit
        env:
          EXPECTED_COMMIT: ${{ inputs.source_ref || github.sha }}
        run: |
          expected="$EXPECTED_COMMIT"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          test "$expected" = "$(git rev-parse HEAD)"
          test "${#expected}" -eq 40
          echo "commit=$expected" >> "$GITHUB_OUTPUT"
      - name: Generate source SPDX SBOM
        run: |
          mkdir -p release/evidence
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/release/evidence:/evidence" \
            anchore/syft@sha256:95fe0835e5bebc6f8b1f8acef68d47d63d594ef4c0f25c097ff853b23cbac74c \
            dir:/src -o spdx-json=/evidence/source.spdx.json \
            --exclude './.git/**' --exclude '**/node_modules/**' --exclude '**/target/**' \
            --exclude '**/.next/**' --exclude '**/dist/**' --exclude '**/test-results/**' \
            --exclude './release/evidence/**'
          test -s release/evidence/source.spdx.json
      - name: Scan explicit existing lockfiles with pinned OSV
        id: osv-scan
        shell: bash
        run: |
          mkdir -p .tmp/security
          image=ghcr.io/google/osv-scanner@sha256:8108ae94eadea5a02c9bec6e646909d5b790b44bd62d7f5b7f0b1d6d0ffc7734
          set +e
          docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /osv-scanner "$image" --version > release/evidence/osv-version.log 2>&1
          version_status=$?
          set -e
          printf '%s\n' "$version_status" > release/evidence/osv-version.exit
          test "$version_status" -eq 0
          grep -Eq '^osv-scanner version:[[:space:]]*2\.5\.1([[:space:]]|$)' release/evidence/osv-version.log
          common=(--rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --entrypoint /osv-scanner
            --user "$(id -u):$(id -g)"
            --cpus=2 --memory=1g --tmpfs '/tmp:rw,nosuid,nodev,size=128m'
            -v "$PWD:/github/workspace:ro" -w /github/workspace
            -v "$PWD/release/evidence:/evidence")
          locks=(--lockfile=/github/workspace/Cargo.lock
            --lockfile=/github/workspace/apps/web/pnpm-lock.yaml
            --lockfile=/github/workspace/packages/api-client/pnpm-lock.yaml
            --lockfile=/github/workspace/services/edge/pnpm-lock.yaml)
          set +e
          timeout --signal=TERM --kill-after=30s 600s docker run "${common[@]}" "$image" \
            scan source --all-packages --config=/github/workspace/osv-scanner.toml \
            --format json --output-file /evidence/osv.json "${locks[@]}" > release/evidence/osv-json.log 2>&1
          scanner_status=$?
          reporter_status=-1
          if [[ "$scanner_status" == 0 || "$scanner_status" == 1 ]]; then
            timeout --signal=TERM --kill-after=30s 600s docker run "${common[@]}" "$image" \
              scan source --all-packages --config=/github/workspace/osv-scanner.toml \
              --format sarif --output-file /evidence/osv.sarif "${locks[@]}" > release/evidence/osv-sarif.log 2>&1
            reporter_status=$?
          fi
          set -e
          echo "scanner_exit=$scanner_status" >> "$GITHUB_OUTPUT"
          echo "reporter_exit=$reporter_status" >> "$GITHUB_OUTPUT"
      - name: Validate and classify OSV evidence
        id: osv-report
        env:
          DEVELOPMENT_ADVISORY: ${{ inputs.development-advisory }}
          SCANNER_EXIT: ${{ steps.osv-scan.outputs.scanner_exit }}
          REPORTER_EXIT: ${{ steps.osv-scan.outputs.reporter_exit }}
        run: |
          args=()
          if [[ "$DEVELOPMENT_ADVISORY" == true ]]; then args+=(--advisory); fi
          python3 scripts/security_scan_summary.py osv --json release/evidence/osv.json \
            --sarif release/evidence/osv.sarif --scan-exit "$SCANNER_EXIT" --report-exit "$REPORTER_EXIT" \
            --lockfile Cargo.lock --lockfile apps/web/pnpm-lock.yaml \
            --lockfile packages/api-client/pnpm-lock.yaml --lockfile services/edge/pnpm-lock.yaml "${args[@]}"
      - name: Upload OSV SARIF to code scanning
        if: ${{ !cancelled() && steps.osv-report.outputs.report_valid == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: release/evidence/osv.sarif
          category: osv-source
          wait-for-processing: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
      - name: Audit pnpm dependency graphs
        env:
          DEVELOPMENT_ADVISORY: ${{ inputs.development-advisory }}
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          set +e
          timeout --signal=TERM --kill-after=30s 300s \
            pnpm --dir apps/web audit --audit-level moderate --json \
            > release/evidence/pnpm-audit-web.json
          web_status=$?
          timeout --signal=TERM --kill-after=30s 300s \
            pnpm --dir packages/api-client audit --audit-level moderate --json \
            > release/evidence/pnpm-audit-client.json
          client_status=$?
          timeout --signal=TERM --kill-after=30s 300s \
            pnpm --dir services/edge audit --audit-level moderate --json \
            > release/evidence/pnpm-audit-edge.json
          edge_status=$?
          set -e
          args=()
          if [[ "$DEVELOPMENT_ADVISORY" == true ]]; then args+=(--advisory); fi
          python3 scripts/security_scan_summary.py audit --evidence release/evidence \
            --statuses "$web_status,$client_status,$edge_status" "${args[@]}"
      - name: Upload dependency and SBOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-dependency-evidence-${{ inputs.source_ref || github.sha }}
          path: release/evidence
          if-no-files-found: error
          retention-days: 30

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Scan history with verified Gitleaks and a dedicated findings exit
        env:
          DEVELOPMENT_ADVISORY: ${{ inputs.development-advisory }}
        run: |
          mkdir -p release/evidence "$RUNNER_TEMP/gitleaks"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          test "$(git rev-list --all --count)" -gt 0
          set +e
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact=100 --no-banner --exit-code=42 \
            --log-opts="--all" --report-format=json --report-path=release/evidence/gitleaks.json . \
            > release/evidence/gitleaks.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > release/evidence/gitleaks.exit
          args=()
          if [[ "$DEVELOPMENT_ADVISORY" != true ]]; then args+=(--strict); fi
          python3 scripts/security_findings.py gitleaks --report release/evidence/gitleaks.json \
            --exit-code "$status" "${args[@]}"
      - name: Retain redacted secret report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-secrets-${{ inputs.source_ref || github.sha }}
          path: release/evidence/gitleaks*
          if-no-files-found: error
          retention-days: 30

  iac:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Scan deployment configuration
        env:
          DEVELOPMENT_ADVISORY: ${{ inputs.development-advisory }}
        run: |
          mkdir -p release/evidence .tmp
          cp -a deploy .tmp/iac-source
          for environment in staging production; do
            cp ".tmp/iac-source/tofu/environments/$environment/terraform.tfvars.example" \
              ".tmp/iac-source/tofu/environments/$environment/terraform.tfvars"
          done
          set +e
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/release/evidence:/evidence" \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            config --exit-code 42 --include-non-failures --severity MEDIUM,HIGH,CRITICAL \
            --helm-values /src/deploy/helm/values-ci.yaml \
            --helm-values /src/deploy/helm/values-observability-ci.yaml \
            --helm-values /src/deploy/helm/values-progressive-ci.yaml \
            --format json --output /evidence/trivy-iac.json /src/.tmp/iac-source \
            > release/evidence/trivy-iac.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > release/evidence/trivy-iac.exit
          if grep -Eq 'WARN|ERROR|FATAL|Skipping chart' release/evidence/trivy-iac.log; then
            echo "::error::Trivy emitted a coverage or execution diagnostic; see the retained log"
            exit 2
          fi
          args=()
          if [[ "$DEVELOPMENT_ADVISORY" != true ]]; then args+=(--strict); fi
          python3 scripts/security_findings.py trivy --report release/evidence/trivy-iac.json \
            --exit-code "$status" "${args[@]}"
      - name: Upload IaC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-iac-evidence-${{ inputs.source_ref || github.sha }}
          path: release/evidence
          if-no-files-found: error
          retention-days: 30

  codeql:
    needs: report-contract
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: "false"
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: release/evidence/codeql/${{ matrix.language }}
          upload: always
          category: /language:${{ matrix.language }}
      - name: Report bounded CodeQL finding and diagnostic inventory
        if: ${{ !cancelled() }}
        run: python3 scripts/summarize_codeql_results.py release/evidence/codeql/${{ matrix.language }}
      - name: Upload CodeQL SARIF evidence
        if: ${{ !cancelled() && hashFiles(format('release/evidence/codeql/{0}/**/*.sarif', matrix.language)) != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ inputs.source_ref || github.sha }}
          path: release/evidence/codeql/${{ matrix.language }}
          if-no-files-found: error
          retention-days: 30
