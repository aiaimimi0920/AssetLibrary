name: Security

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  policy:
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-policy.yml
    secrets: inherit
