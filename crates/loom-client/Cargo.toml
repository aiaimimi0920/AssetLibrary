[package]
name = "assetlibrary-loom-client"
version = "0.1.0"
edition = "2024"

[dependencies]
assetlibrary-contracts = { path = "../contracts" }
assetlibrary-supply-chain = { path = "../supply-chain" }
async-trait = "0.1"
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
