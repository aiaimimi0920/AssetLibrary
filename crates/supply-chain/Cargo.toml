[package]
name = "assetlibrary-supply-chain"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
ed25519-dalek = "3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.11"
thiserror = "2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
