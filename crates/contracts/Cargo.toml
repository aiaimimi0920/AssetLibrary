[package]
name = "assetlibrary-contracts"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
time = { version = "0.3.55", features = ["parsing"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
serde_json = "1"
