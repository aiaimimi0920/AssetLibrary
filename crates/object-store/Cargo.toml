[package]
name = "assetlibrary-object-store"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
assetlibrary-telemetry = { path = "../telemetry" }
async-trait = "0.1"
aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "http-1x", "rt-tokio"] }
base64 = "0.23"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util"] }
url = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "time"] }
