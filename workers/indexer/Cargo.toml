[package]
name = "assetlibrary-indexer-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
assetlibrary-contracts = { path = "../../crates/contracts" }
assetlibrary-telemetry = { path = "../../crates/telemetry" }
async-nats = "0.50"
futures-util = "0.3"
hex = "0.4"
redis = { version = "0.32", features = ["tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json", "macros"] }
thiserror = "2"
time = { version = "0.3.55", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
