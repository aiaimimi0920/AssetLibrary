[package]
name = "assetlibrary-cleanup-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
assetlibrary-object-store = { path = "../../crates/object-store" }
assetlibrary-telemetry = { path = "../../crates/telemetry" }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
