[package]
name = "assetlibrary-scanner-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
assetlibrary-contracts = { path = "../../crates/contracts" }
assetlibrary-object-store = { path = "../../crates/object-store" }
assetlibrary-supply-chain = { path = "../../crates/supply-chain" }
assetlibrary-telemetry = { path = "../../crates/telemetry" }
async-nats = "0.50"
base64 = { version = "0.23", default-features = false, features = ["std"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "json"] }
tempfile = "3"
thiserror = "2"
time = "0.3.55"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
ed25519-dalek = "2.2"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
